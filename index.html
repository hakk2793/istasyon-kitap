<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstasyon: Çıkış Tanımsız - Peron 9</title>
    
    <script src='//libtl.com/sdk.js' data-zone='10588228' data-sdk='show_10588228'></script>
    
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        .container { 
            max-width: 600px; 
            width: 90%; 
            padding: 20px; 
            text-align: center; 
            margin-top: 50px; 
        }
        .page-content { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); 
            min-height: 250px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            line-height: 1.6; 
            border-left: 5px solid #38bdf8; 
            margin-bottom: 20px;
        }
        .btn { 
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%); 
            color: #0f172a; 
            border: none; 
            padding: 15px 40px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1.1rem; 
            transition: 0.3s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.4); 
        }
        .page-num { 
            margin-bottom: 10px; 
            color: #94a3b8; 
            font-size: 0.9rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .vip-note { 
            margin-top: 30px; 
            font-size: 0.85rem; 
            color: #38bdf8; 
            font-style: italic; 
            background: rgba(56, 189, 248, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
        h2 { color: #38bdf8; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">İstasyon: Çıkış Tanımsız</h2>
    <div class="page-num" id="page-info">BÖLÜM: 1 / 11</div>
    <div class="page-content" id="content">Hikaye yükleniyor, lütfen bekleyin...</div>
    <button class="btn" id="next-btn" onclick="nextPage()">SONRAKİ SAYFA</button>
    <div class="vip-note" id="vip-msg">
        Reklamsız ve hızlı okumak ister misin? <br>
        <strong>@GogircinAdminBot</strong> üzerinden VIP üye ol!
    </div>
</div>

<script>
    // 11 SAYFALIK HİKAYE VERİSİ [2026-02-09]
    const story = [
        "Gece yarısıydı. Saatler 00:00'ı gösterdiğinde Peron 9'da sadece bir kişi bekliyordu. Trenin sesi duyulmuyor, sadece soğuk bir rüzgar esiyordu.",
        "Rayların arasından gelen o fısıltı, eski bir dilin yankısı gibiydi. 'Çıkış yok' diyordu ses, 'Sadece geçiş var.'",
        "Birden ışıklar titremeye başladı. Peronun sonundaki kapı yavaşça aralandı. İçeriden mor bir ışık sızıyordu.",
        "Adım attığı her yer sanki zeminden değil, zamandan yapılmıştı. Ayaklarının altındaki taşlar eriyor gibiydi.",
        "Duvarlarda yazan isimleri fark etti. Hepsi birer yolcu ismiydi ama tarihler 2026'dan sonrasını gösteriyordu. (Sıradaki sayfa için reklam yükleniyor...)",
        "Kuanta istasyonuna hoş geldiniz. Burası gerçekliğin büküldüğü son nokta. Buradan geri dönüş ancak anahtarla mümkün.",
        "Anahtar cebinde ağırlık yapmaya başladı. Soğuk metal, tenini yakıyordu. Bu anahtar sadece kapıları değil, kaderi de açıyordu.",
        "Gölgesi ondan bağımsız hareket etmeye başladı. Gölgesi duvarda farklı bir yöne gidiyordu. 'Beni takip et' dedi gölge.",
        "Son kapıya ulaştığında, karşısında kendini gördü. Diğer kendisi, elinde bir kitap tutuyordu. (Sıradaki sayfa için reklam yükleniyor...)",
        "Her şey bir döngüden ibaretti. Kitabı açtı ve ilk cümleyi okudu: 'Gece yarısıydı...'",
        "İstasyon sessizliğe gömüldü. Artık o, Peron 9'un yeni bekçisiydi. İlk hikaye burada bitti ama yolculuk yeni başlıyor."
    ];

    let currentPage = 0;

    function updatePage() {
        document.getElementById('content').innerText = story[currentPage];
        document.getElementById('page-info').innerText = `BÖLÜM: ${currentPage + 1} / 11`;
        
        if (currentPage === story.length - 1) {
            document.getElementById('next-btn').innerText = "KİTAP BİTTİ";
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').style.opacity = "0.5";
            document.getElementById('vip-msg').innerHTML = "<strong>2. Kitap Çok Yakında!</strong><br>VIP üyeler ön okuma hakkına sahiptir.";
        }
    }

    function nextPage() {
        // REKLAM TETİKLEME NOKTALARI: 5. ve 9. sayfalardan önce reklam göster
        if (currentPage === 4 || currentPage === 8) {
            if (typeof show_10588228 === 'function') {
                show_10588228().then(() => {
                    // Reklam başarıyla izlendi, kripto kazanıldı, devam et!
                    proceed();
                }).catch((e) => {
                    // Reklamda hata olursa okuyucu takılmasın, devam ettir
                    console.log("Reklam yüklenemedi:", e);
                    proceed();
                });
            } else {
                proceed();
            }
        } else if (currentPage < story.length - 1) {
            proceed();
        }
    }

    function proceed() {
        currentPage++;
        updatePage();
        window.scrollTo(0,0); // Sayfa değişince yukarı kaydır
    }

    // Başlangıç ayarı
    updatePage();
</script>

</body>
</html>
