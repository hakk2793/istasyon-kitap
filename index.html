<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orijinal Kitaplık</title>

<script src='//libtl.com/sdk.js' data-zone='10588228' data-sdk='show_10588228'></script>

<style>
:root {
  --p:#3498db;
  --bg:#050505;
  --card:#121212;
}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:'Segoe UI',sans-serif;
}
#main{
  padding:30px 15px;
  text-align:center;
}
.logo{
  width:70px;
  height:70px;
  border-radius:18px;
  border:2px solid var(--p);
  box-shadow:0 0 20px rgba(52,152,219,.4);
}
h1{
  margin:20px 0 30px;
  letter-spacing:3px;
  color:var(--p);
  font-size:.95rem;
}
.shelf{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.book{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid #222;
  box-shadow:0 10px 30px rgba(0,0,0,.8);
}
.book:active{transform:scale(.97)}
.cover{
  position:relative;
  height:210px;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.75);
}
.fade{
  position:absolute;
  bottom:0;left:0;
  width:100%;
  height:60%;
  background:linear-gradient(to top,#000,transparent);
}
.badge{
  position:absolute;
  top:10px;right:10px;
  font-size:.55rem;
  padding:5px 9px;
  border-radius:7px;
  font-weight:700;
}
.open{background:#2ecc71}
.soon{background:#e67e22}
.info{
  padding:12px;
  text-align:left;
}
.title{
  font-size:.8rem;
  font-weight:800;
}
.tag{
  font-size:.6rem;
  color:var(--p);
  margin-top:4px;
  letter-spacing:1px;
}
a{
  text-decoration:none;
  color:inherit;
}
</style>
</head>

<body>
<div id="main">

<img src="https://i.hizliresim.com/itrz588.png" class="logo">

</div>

</div>
